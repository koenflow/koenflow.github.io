<h1>Cockpit</h1>
<p>Cockpit is een persoonlijke app voor eigen gebruik. De app helpt de eigenaar de eigen
administratie bij te houden: facturen en belangrijke documenten uit de eigen mailbox worden
herkend en in de eigen Google Drive opgeslagen.</p>
<p>De app is niet bedoeld voor andere gebruikers.</p>
